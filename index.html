<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Gift ❤️</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <!-- Hearts -->

    <div class="hearts">

        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>

    </div>

    <!-- Sparkles -->

    <div class="sparkles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- Main -->

    <main class="home">

        <!-- Logo -->

        <img src="images/logo.png" class="logo" alt="Logo">

        <!-- Title -->

        <h1 id="giftTitle"></h1>

        <p class="subtitle">

             خرزة و استك by 

        </p>

        <!-- Gift -->

        <section class="gift-section">

    <!-- Gift -->

    <div id="giftBox">

        <div class="gift-box">

            <div class="gift-lid"></div>

            <div class="gift-body"></div>

            <div class="gift-ribbon-v"></div>

            <div class="gift-ribbon-h"></div>

        </div>

    </div>

    <!-- Envelope -->

    <div id="envelope" class="envelope hidden">

        <div class="envelope-body">

            <div class="envelope-flap"></div>

            <div class="seal">
    <img src="images/logo.png" alt="Logo">
</div>

        </div>

    </div>

    <!-- Letter -->

    <div id="letter" class="letter hidden">

        <div class="letter-card">

            <h2>My Love ❤️</h2>

            <p id="typingText"></p>

            <button id="continueBtn" class="continue-btn hidden">

                Continue

            </button>

        </div>

    </div>

</section>

    </div>

</div>


        </section>

        <!-- Hint -->

        <p id="hint" class="hint">

            Tap The Gift To Begin ✨

        </p>

    </main>

    <!-- =========================
     MEMORIES
========================= -->


    <section id="memories" class="memories">
    <div class="memories-content">

        <p class="story-label">OUR STORY</p>

        <h2 class="story-title">
            Every moment<br>
            <span>with you</span>
        </h2>

        <p class="story-hint">
            Swipe to explore&nbsp; • &nbsp;Tap to reveal
        </p>

        <!-- Memory Card -->

        <div class="memory-scene">

            <div id="memoryCard" class="memory-card">

                <!-- Front -->

                <div class="memory-front">

                    <div class="photo-frame">

                        <img id="memoryImage"
                             src="images/photo1.jpg"
                             alt="Memory">

                    </div>

                </div>

                <!-- Back -->

                <div class="memory-back">

                    <span class="back-heart">♡</span>

                    <p id="memoryMessage">
                        Your memory message goes here ❤️
                    </p>

                </div>

            </div>

        </div>

        <!-- Navigation -->

        <div class="memory-navigation">

            <button id="prevMemory" class="memory-arrow">
                →
            </button>

            <div id="memoryDots" class="memory-dots">
                <span class="active"></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <button id="nextMemory" class="memory-arrow">
                ←
            </button>

        </div>

        <!-- Caption -->

        <div class="memory-caption">

            <span>♡</span>

            <p>
                Every Moment Became A Memory With You
            </p>

        </div>

        <button id="audioButton" class="audio-button" style="display: none;">
    <span class="audio-button-icon">♡</span>
    <span id="audioButtonText"></span>
</button>

    </div>

</section>

<!-- Audio Section -->

<section id="audioSection" class="audio-section" style="display: none;">

    <div class="audio-content">

        <p id="audioLabel" class="audio-label"></p>

        <h2 id="audioTitle" class="audio-title"></h2>

        <p id="audioTrackName" class="audio-track-name"></p>

        <div class="audio-player">

            <audio id="audioPlayer" preload="metadata"></audio>

            <button id="audioPlayButton" class="audio-play-button" aria-label="Play">
    <span class="play-icon"></span>
</button>

            <div class="audio-progress">
                <div id="audioProgressBar" class="audio-progress-bar"></div>
                <span id="audioProgressThumb" class="audio-progress-thumb"></span>
            </div>

            <div class="audio-time">
                <span id="audioCurrentTime">0:00</span>
                <span id="audioDuration">0:00</span>
            </div>

        </div>

        <!-- زر الرجوع يكون هنا -->
        <button id="backToMemories" class="back-to-memories">
             Back to Memories ←
        </button>

    </div>

</section>

    <!-- JavaScript -->

   <script src="client-data.js"></script>
<script src="js/app.js"></script>

</body>

</html>
