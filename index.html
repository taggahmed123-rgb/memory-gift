<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Gift</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Main Screen -->
    <main class="home">

        <!-- Logo -->
        <img src="images/logo.png" class="logo" alt="Logo">

        <!-- Title -->
        <h1>Memory Gift</h1>

        <p class="subtitle">
            by خرزة و استك
        </p>

        <!-- Gift Area -->
        <section class="gift-section">

            <div id="giftBox">

                <!-- هنرسم الصندوق بالـ CSS -->
                <div class="gift-box">

                    <div class="gift-lid"></div>

                    <div class="gift-body"></div>

                    <div class="gift-ribbon-v"></div>

                    <div class="gift-ribbon-h"></div>

                </div>

            </div>

        </section>

        <p class="hint">
            Open My Gift ✨
        </p>

    </main>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
